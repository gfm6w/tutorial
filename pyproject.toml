[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gfm6w"
version = "0.1.0"
description = "Build tools of the GridFM Porto tutorial"
requires-python = ">=3.10"
dependencies = ["nbclient", "nbformat", "pillow", "pyyaml"]

[project.scripts]
gfm6w = "gfm6w.cli:main"

[tool.setuptools]
packages = ["gfm6w"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["site"]

[tool.ruff.format]
exclude = ["notebooks/solutions/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
"notebooks/solutions/*.py" = ["E402", "E703", "F821"]
