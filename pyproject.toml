[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gfm6w"
version = "0.1.0"
description = "Build tools of the GridFM Porto tutorial"
requires-python = ">=3.10"
dependencies = ["nbclient", "nbformat", "pillow", "pyyaml"]

[tool.setuptools]
packages = ["gfm6w"]
